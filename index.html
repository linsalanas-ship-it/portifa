<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alana Lins — jornalista, estrategista e redatora</title>
  <meta name="description" content="Alana Lins: jornalista, estrategista e redatora. Estratégia de marca, identidade verbal, conteúdo e copywriting.">
  <meta name="theme-color" content="#F1EBE1">
  <link rel="preload" href="assets/fonts/Switzer-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=2026110304">
  <script>
    // Decide antes de pintar a página se a abertura com o lápis vai rodar:
    // só na primeira visita da sessão e sem #âncora na URL.
    try {
      if (!location.hash && !sessionStorage.getItem("introVista")) {
        document.documentElement.classList.add("com-abertura");
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div class="grao" aria-hidden="true"></div>
  <header class="menu" id="menu">
    <a class="menu__marca" href="#inicio"><span class="assinatura" aria-hidden="true"></span><span>alana lins</span></a>
    <nav aria-label="Principal">
      <a href="#projetos">projetos</a>
      <a href="#sobre">sobre</a>
      <a href="#contato">contato</a>
      <a href="#" data-loja target="_blank" rel="noopener">loja</a>
    </nav>
  </header>

  <main>
    <!-- Header 3 -->
    <header class="secao hero" id="inicio">
      <!-- as letras do nome são montadas pelo main.js a partir de abertura.nome -->
      <h1 class="nome" id="nome" aria-label="Alana Lins">
        <span class="linha linha--1" aria-hidden="true"></span>
        <span class="linha linha--2" aria-hidden="true"></span>
      </h1>
      <div class="etiqueta" id="etiqueta">
        <p class="etiqueta__texto" data-campo="abertura.etiqueta"></p>
      </div>
    </header>

    <section class="secao projetos" id="projetos">
      <div class="cab">
        <h2 class="titulo" data-campo="secaoProjetos.titulo"></h2>
        <p class="subtitulo" data-campo="secaoProjetos.descricao"></p>
      </div>
      <ul class="grade" id="grade-projetos"></ul>
    </section>

    <section class="secao sobre" id="sobre">
      <div class="cab"><h2 class="titulo" data-campo="sobre.titulo"></h2></div>
      <div class="sobre__conteudo">
        <img class="sobre__foto" id="sobre-foto" alt="" loading="lazy">
        <div class="texto" id="sobre-texto"></div>
      </div>
    </section>

    <section class="secao servicos" id="servicos">
      <div class="cab"><h2 class="titulo" data-campo="servicos.titulo"></h2></div>
      <div class="sopa" id="sopa">
        <p class="sopa__descricao" id="sopa-descricao" aria-live="polite"></p>
      </div>
    </section>

    <section class="secao contato" id="contato">
      <div class="cab"><h2 class="titulo" data-campo="contato.titulo"></h2></div>
      <form class="form" id="form-contato">
        <label class="campo">
          <span class="sr">nome</span>
          <input type="text" name="nome" placeholder="nome" autocomplete="name" required>
        </label>
        <label class="campo">
          <span class="sr">e-mail</span>
          <input type="email" name="email" placeholder="e-mail" autocomplete="email" required>
        </label>
        <label class="campo campo--largo">
          <span class="sr">mensagem</span>
          <textarea name="mensagem" placeholder="mensagem" rows="6" required></textarea>
        </label>
        <div class="form__rodape">
          <p class="form__status" id="form-status" role="status"></p>
          <button type="submit" class="botao">enviar</button>
        </div>
      </form>
      <p class="contato__links micro" id="contato-links"></p>
    </section>
  </main>

  <!-- Abertura: uma folha do mesmo papel em que o lápis desenha a bonequinha -->
  <div class="abertura" id="abertura">
    <div class="abertura__folha" id="abertura-folha">
      <canvas id="abertura-riscos" aria-hidden="true"></canvas>
      <canvas id="abertura-rosto" aria-hidden="true"></canvas>
    </div>
    <canvas id="abertura-lapis" aria-hidden="true"></canvas>
  </div>

  <script src="js/conteudo.js?v=2026110304"></script>
  <script src="js/main.js?v=2026110304"></script>
  <script src="js/abertura.js?v=2026110304"></script>
  <script src="js/lapis.js?v=2026110304"></script>
</body>
</html>
